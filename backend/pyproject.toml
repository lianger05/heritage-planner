[project]
name = "heritage-planner-backend"
version = "0.1.0"
description = "古建文旅经济智能规划助手 - 后端服务"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Database - SQLite async
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",

    # LLM & AI
    "openai>=1.30.0",

    # RAG (可选，本地嵌入式)
    "chromadb>=0.5.0",

    # Data processing
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",

    # Utilities
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.3.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
# 生产环境依赖（需要 Docker）
prod = [
    "asyncpg>=0.29.0",
    "geoalchemy2>=0.15.0",
    "shapely>=2.0.0",
    "redis>=5.0.0",
    "neo4j>=5.20.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "sentence-transformers>=3.0.0",
    "jinja2>=3.1.0",
    "python-docx>=1.1.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
