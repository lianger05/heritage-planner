# Render.com Blueprint 配置 - 自动部署
# Render 在仓库根目录识别此文件，自动创建服务

services:
  - type: web
    name: heritage-planner-api
    env: python
    region: singapore
    plan: free
    rootDir: backend          # 后端代码在此目录
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/heritage_planner.db
      - key: DATABASE_URL_SYNC
        value: sqlite:///./data/heritage_planner.db
      - key: CHROMA_MODE
        value: persistent
      - key: CHROMA_PERSIST_DIR
        value: ./data/chroma_db
      - key: REDIS_ENABLED
        value: "false"
      - key: NEO4J_ENABLED
        value: "false"
      - key: LLM_CACHE_ENABLED
        value: "false"
      # DEEPSEEK_API_KEY 在 Render Dashboard → Environment 中手动设置
